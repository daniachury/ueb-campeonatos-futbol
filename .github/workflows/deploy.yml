name: Deploy

# Cada merge a main se prueba, migra la base de datos, se despliega en Cloudflare
# y avisa el resultado por webhook (Discord, Slack o Teams).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar en Cloudflare
    runs-on: ubuntu-latest
    # El entorno "production" hace que GitHub registre el despliegue y que la app
    # GitHub for Jira lo muestre en cada historia incluida.
    environment: production
    # Los secretos de Cloudflare van solo en los pasos de Wrangler: así ningún script de
    # `npm ci` ni de las pruebas puede leer el token.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas con cobertura
        run: npm run test:ci

      # Las migraciones van antes del build: después del build Wrangler usa la
      # configuración generada en dist/ y no la de wrangler.jsonc.
      - name: Aplicar migraciones de D1
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build
        run: npm run build

      - name: Desplegar el Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Avisar por webhook
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          ESTADO: ${{ job.status }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "No hay webhook configurado (secreto DEPLOY_WEBHOOK_URL); se omite el aviso."
            exit 0
          fi
          COBERTURA=$(jq -r '.total.lines.pct // "n/d"' coverage/coverage-summary.json 2>/dev/null || echo "n/d")
          PRUEBAS=$(jq -r '"\(.numPassedTests)/\(.numTotalTests)"' reports/test-results.json 2>/dev/null || echo "n/d")
          MENSAJE="Deploy ${ESTADO} · ${GITHUB_REPOSITORY}@${GITHUB_SHA::7} · pruebas ${PRUEBAS} · cobertura de líneas ${COBERTURA}% · ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # "content" lo lee Discord; "text", Slack y Teams.
          jq -n --arg m "$MENSAJE" '{content: $m, text: $m}' \
            | curl -sS --fail -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK_URL" \
            || echo "::warning::No se pudo enviar el aviso al webhook (el despliegue no se ve afectado)."
