name: CI

# Se ejecuta en cada Pull Request hacia main. Debe estar en verde para poder hacer merge
# (configurarlo como "required status check" en la protección de la rama main).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # para comentar la cobertura en el PR

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificar tipos
        run: npm run typecheck

      - name: Pruebas con cobertura
        run: npm run test:ci

      - name: Comentar la cobertura en el PR
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        # Acción de terceros con permiso de escritura en el PR: fijada a un commit (v2.9.3).
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73

      - name: Build
        run: npm run build
